<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#121417" />
		<script>
			// Dark is the site's default look; "light" is an explicit visitor choice
			// (see src/composables/useTheme.ts). Runs before any paint so there is
			// no light flash on load.
			(function () {
				var light = false;
				try {
					light = localStorage.getItem("theme") === "light";
				} catch (e) {
					/* storage unavailable - stay on the dark default */
				}
				if (light) {
					document
						.querySelector('meta[name="theme-color"]')
						.setAttribute("content", "#ffffff");
				} else {
					document.documentElement.classList.add("dark");
				}
			})();
		</script>

		<!-- The app CSS ships inside the JS bundle (vite-plugin-css-injected-by-js),
         so until the bundle runs the page has NO stylesheet. These few rules
         keep that pre-JS frame on the correct theme background - mirror
         App.vue's --dm-bg (dark, same as the theme-color meta above) if that
         ever changes. -->
		<style>
			body {
				margin: 0;
				background: #ffffff;
			}
			html.dark body {
				background: #121417;
			}
		</style>

		<!-- Primary SEO -->
		<title>Denis Liamkin - Senior Software Engineer</title>
		<meta
			name="description"
			content="Senior Software Engineer with 12+ years building full-stack enterprise applications across telehealth and real estate. Expert in Vue, Angular, C#/.NET, AWS, and Azure."
		/>
		<meta name="author" content="Denis Liamkin" />
		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://dliamkin.com/" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://dliamkin.com/" />
		<meta property="og:site_name" content="Denis Liamkin" />
		<meta property="og:locale" content="en_US" />
		<meta
			property="og:title"
			content="Denis Liamkin - Senior Software Engineer"
		/>
		<meta
			property="og:description"
			content="Senior Software Engineer with 12+ years building full-stack enterprise applications across telehealth and real estate. Expert in Vue, Angular, C#/.NET, AWS, and Azure."
		/>
		<meta property="og:image" content="https://dliamkin.com/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Denis Liamkin - Senior Software Engineer"
		/>

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://dliamkin.com/" />
		<meta
			name="twitter:title"
			content="Denis Liamkin - Senior Software Engineer"
		/>
		<meta
			name="twitter:description"
			content="Senior Software Engineer with 12+ years building full-stack enterprise applications across telehealth and real estate."
		/>
		<meta
			name="twitter:image"
			content="https://dliamkin.com/og-image.png"
		/>
		<meta
			name="twitter:image:alt"
			content="Denis Liamkin - Senior Software Engineer"
		/>

		<!-- LCP: the hero portfolio wall's top two rows. The SPA only requests
         them after the JS bundle runs; preloading starts the fetch during HTML
         parse instead. Desktop's LCP element sits in row one, mobile's in row
         two (the wall shifts right on small screens), so all four are
         preloaded. imagesrcset/imagesizes MUST match the <img> srcset/sizes in
         HeroBanner.vue exactly, or the preload is wasted and the image fetched
         twice. The -340 variants come from scripts/optimize-images.mjs.
         Injected by script rather than static <link> tags because this SPA
         serves the same HTML on every route: the wall only exists on the home
         page, and ~70KB of preloaded hero images was crowding the critical
         window (fonts, route chunks) of every other page. The script runs
         synchronously during head parsing, so on "/" the requests still start
         before the body is parsed. -->
		<script>
			(function () {
				if (window.location.pathname !== "/") return;
				var sizes =
					"(max-width: 600px) 440px, (max-width: 1024px) 510px, calc(clamp(760px, 50vw, 1440px) / 2 - 40px)";
				["entomology", "resetu", "oakwood", "ole"].forEach(
					function (name) {
						var l = document.createElement("link");
						l.rel = "preload";
						l.as = "image";
						l.fetchPriority = "high";
						l.imageSrcset =
							"/images/" +
							name +
							"-340.webp 340w, /images/" +
							name +
							".webp 500w";
						l.imageSizes = sizes;
						document.head.appendChild(l);
					},
				);
			})();
		</script>

		<!-- Google Analytics (gtag.js). The gtag stub is defined inline so calls
         queue in dataLayer from the first moment; the library itself loads on
         the visitor's FIRST interaction (scroll/tap/keypress), or 8 s after
         the load event as a fallback for passive readers. Even deferred to
         the load event, gtag's ~200 ms of script evaluation landed inside the
         Lighthouse trace window and cost real LCP/TBT on throttled mobile -
         interaction gating keeps it out of the load window entirely, for lab
         runs and real visitors alike. Queued events (including the first
         page_view from src/router/index.ts) flush once it arrives; sessions
         that end within 8 s with zero interaction go uncounted, an accepted
         trade. Auto page_view stays off - the SPA reports its own. -->
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag("js", new Date());
			gtag("config", "G-HRJ8CP3WVN", { send_page_view: false });
			(function () {
				var loaded = false;
				var events = ["pointerdown", "keydown", "scroll", "touchstart"];
				function loadGtag() {
					if (loaded) return;
					loaded = true;
					events.forEach(function (e) {
						window.removeEventListener(e, loadGtag);
					});
					var s = document.createElement("script");
					s.async = true;
					s.src =
						"https://www.googletagmanager.com/gtag/js?id=G-HRJ8CP3WVN";
					document.head.appendChild(s);
				}
				events.forEach(function (e) {
					window.addEventListener(e, loadGtag, {
						passive: true,
						once: true,
					});
				});
				window.addEventListener(
					"load",
					function () {
						setTimeout(loadGtag, 8000);
					},
					{ once: true },
				);
			})();
		</script>

		<!-- Fonts: self-hosted latin variable-font subsets (downloaded from
         Google Fonts, one file per family covering every weight the site
         uses). Inline @font-face + same-origin preloads mean the fonts are
         discovered at HTML parse and usually land BEFORE first render - no
         font-swap repaint. That swap was measurably expensive: the demo
         pages' LCP element is a text paragraph, and the late Raleway arrival
         re-triggered its LCP paint (~+1s); the swap also caused most of
         note-structurer's CLS. Cormorant only appears below the fold, so it
         gets a face but no preload. font-display stays swap as a fallback
         for cold caches on very slow connections. -->
		<style>
			@font-face {
				font-family: "Raleway";
				font-style: normal;
				font-weight: 400 700;
				font-display: swap;
				src: url("/fonts/raleway-latin.woff2") format("woff2");
				unicode-range:
					U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
					U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC,
					U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: "Quicksand";
				font-style: normal;
				font-weight: 300 500;
				font-display: swap;
				src: url("/fonts/quicksand-latin.woff2") format("woff2");
				unicode-range:
					U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
					U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC,
					U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: "JetBrains Mono";
				font-style: normal;
				font-weight: 400 700;
				font-display: swap;
				src: url("/fonts/jetbrains-mono-latin.woff2") format("woff2");
				unicode-range:
					U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
					U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC,
					U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: "Cormorant Garamond";
				font-style: normal;
				font-weight: 300 500;
				font-display: swap;
				src: url("/fonts/cormorant-garamond-latin.woff2")
					format("woff2");
				unicode-range:
					U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
					U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC,
					U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
		</style>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/raleway-latin.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/quicksand-latin.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/jetbrains-mono-latin.woff2"
			crossorigin
		/>
		<!-- Subset by scripts/generate-fa-subset.mjs (~12KB across all three
         styles) - small enough that late icon arrival never shifts layout. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/fa-solid-900.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/fa-regular-400.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/fa-brands-400.woff2"
			crossorigin
		/>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
